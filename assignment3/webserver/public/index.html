<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Museum of Science Education Portal</title>
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <header>
    <nav class="site-nav">
      <a class="logo" href="index.html"><img src="images/logo.png" alt="ACI Inc. logo - home"></a>
      <a href="#students">For Students</a>
      <a href="#parents">For Parents</a>
      <a href="#educators">For Educators</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Museum of Science</h1>
      <a class="btn btn-dark" href="#featured-exhibit">Featured Exhibit</a>
    </section>

    <section class="ask-llm">
      <h2>Ask LLM</h2>
      <form action="search-results.html" method="get">
        <fieldset>
          <legend class="visually-hidden" hidden>I am a</legend>
          <label><input type="radio" name="audience" value="students"> Students</label>
          <label><input type="radio" name="audience" value="parents"> Parents</label>
          <label><input type="radio" name="audience" value="educators"> Educators</label>
        </fieldset>
        <input type="search" name="q" aria-label="Ask a question" placeholder="Search">
      </form>
    </section>

    <section class="exhibits">
      <h2>Upcoming Exhibits</h2>
      <div class="carousel">
        <figure class="card"><img src="images/exhibits/art-illusion.jpg" alt="The Art of Illusion" loading="lazy"><figcaption>The Art of Illusion<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><img src="images/exhibits/innovation-earth.jpg" alt="Innovation: Earth" loading="lazy"><figcaption>Innovation: Earth<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><img src="images/exhibits/gaia-globe.jpg" alt="Gaia Globe" loading="lazy"><figcaption>Gaia Globe<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><img src="images/exhibits/exploring-ai-making-invisible-visible.png" alt="Exploring AI: Making the Invisible Visible" loading="lazy"><figcaption>Exploring AI: Making the Invisible Visible<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><div class="placeholder-img">Hall of Human Life</div><figcaption>Hall of Human Life</figcaption></figure>
        <figure class="card"><img src="images/exhibits/arctic-adventure-exploring-technology.jpg" alt="Arctic Adventure: Exploring with Technology" loading="lazy"><figcaption>Arctic Adventure: Exploring with Technology<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><img src="images/exhibits/engineering-design-workshop-powered-mathworks.jpg" alt="Engineering Design Workshop" loading="lazy"><figcaption>Engineering Design Workshop<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><img src="images/exhibits/colossal-fossil-triceratops-cliff.jpg" alt="Colossal Fossil: Triceratops Cliff" loading="lazy"><figcaption>Colossal Fossil: Triceratops Cliff<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><img src="images/exhibits/dinosaurs-modeling-mesozoic.jpg" alt="Dinosaurs: Modeling the Mesozoic" loading="lazy"><figcaption>Dinosaurs: Modeling the Mesozoic<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><img src="images/exhibits/yawkey-gallery-charles-river.jpg" alt="Yawkey Gallery on the Charles River" loading="lazy"><figcaption>Yawkey Gallery on the Charles River<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><div class="placeholder-img">Theater of Electricity</div><figcaption>Theater of Electricity</figcaption></figure>
        <figure class="card"><img src="images/exhibits/mathematica.jpg" alt="Mathematica: A World of Numbers" loading="lazy"><figcaption>Mathematica: A World of Numbers<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><div class="placeholder-img">Math Moves!: Ratio &amp; Proportion</div><figcaption>Math Moves!: Ratio &amp; Proportion</figcaption></figure>
        <figure class="card"><img src="images/exhibits/science-park.jpg" alt="Science in the Park" loading="lazy"><figcaption>Science in the Park<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><div class="placeholder-img">Nanotechnology</div><figcaption>Nanotechnology</figcaption></figure>
        <figure class="card"><img src="images/exhibits/take-closer-look.jpg" alt="Take a Closer Look" loading="lazy"><figcaption>Take a Closer Look<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><img src="images/exhibits/transportation.jpg" alt="Machines &amp; Transportation" loading="lazy"><figcaption>Machines &amp; Transportation<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><img src="images/exhibits/moon.jpg" alt="To the Moon" loading="lazy"><figcaption>To the Moon<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><img src="images/exhibits/new-england-habitats.jpg" alt="New England Habitats" loading="lazy"><figcaption>New England Habitats<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><div class="placeholder-img">A Bird's World</div><figcaption>A Bird's World</figcaption></figure>
        <figure class="card"><img src="images/exhibits/cosmic-light.jpg" alt="Charles Hayden Planetarium / Cosmic Light" loading="lazy"><figcaption>Charles Hayden Planetarium / Cosmic Light<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><div class="placeholder-img">Foucault Pendulum</div><figcaption>Foucault Pendulum</figcaption></figure>
        <figure class="card"><div class="placeholder-img">Soundstair &amp; Kinetic Art</div><figcaption>Soundstair &amp; Kinetic Art</figcaption></figure>
        <figure class="card"><img src="images/exhibits/live-animal-care-center.jpg" alt="Live Animal Care Center" loading="lazy"><figcaption>Live Animal Care Center<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><img src="images/exhibits/natural-mysteries.jpg" alt="Natural Mysteries" loading="lazy"><figcaption>Natural Mysteries<small class="credit">Photo: Museum of Science</small></figcaption></figure>
        <figure class="card"><div class="placeholder-img">AlegreMENTE | Happy Brain</div><figcaption>AlegreMENTE | Happy Brain</figcaption></figure>
      </div>
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </section>

    <section class="events">
      <div class="calendar">
        <h3>Calendar Widget</h3>
        <div class="calendar-grid" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="event-info">
        <h2>Event Info</h2>
        <p>Information on calendar content XYZ</p>
        <a class="btn" href="#events">Learn More</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div>
      <h2>FAQ</h2>
      <div class="social" aria-hidden="true"><span></span><span></span><span></span></div>
      <small>Legal / copyright info</small>
    </div>
    <div class="map">
      <h3>Map</h3>
      <div class="map-box">Map placeholder</div>
    </div>
  </footer>
</body>
</html>
